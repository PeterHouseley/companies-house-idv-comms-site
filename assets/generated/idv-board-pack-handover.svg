  <path d="M70 220h180l24-38h310c28 0 50 22 50 50v304c0 28-22 50-50 50H92c-28 0-50-22-50-50V248c0-16 12-28 28-28z" class="folder"/>
  <rect x="86" y="262" width="506" height="270" rx="24" fill="#f8f4e9" stroke="#d7d0c1"/>
  <rect x="112" y="292" width="154" height="32" rx="16" class="deep"/><text x="132" y="314" class="mono" font-size="13" fill="#fff">HANDOVER INDEX</text>
  <g class="sans" font-size="16">
    <rect x="112" y="354" width="430" height="44" rx="13" fill="#fffdf7"/><text x="134" y="382" fill="#17231f">01 Partner decision note</text><text x="448" y="382" fill="#1f6a52">SIGNED</text>
    <rect x="112" y="414" width="430" height="44" rx="13" fill="#fffdf7"/><text x="134" y="442" fill="#17231f">02 Client bulletin + FAQ</text><text x="454" y="442" fill="#1f6a52">READY</text>
    <rect x="112" y="474" width="430" height="44" rx="13" fill="#fffdf7"/><text x="134" y="502" fill="#17231f">03 Staff script + escalation rules</text><text x="434" y="502" fill="#b9822e">BRIEF</text>
  </g>
</g>
