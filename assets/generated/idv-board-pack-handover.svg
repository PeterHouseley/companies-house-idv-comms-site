<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
<title id="title">Director IDV board pack handover</title>
<desc id="desc">A professional accountancy practice handover bundle showing partner note, client bulletin, staff script, director tracker and weekly digest for Companies House ID verification communications.</desc>
<defs>
  <filter id="lift" x="-10%" y="-18%" width="126%" height="152%"><feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#173c32" flood-opacity="0.18"/></filter>
  <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0v46" fill="none" stroke="#173c32" stroke-opacity=".045"/><circle cx="34" cy="13" r="1.4" fill="#b9822e" fill-opacity=".16"/></pattern>
  <style>
    .bg{fill:#f4eee1}.paper{fill:#fffdf7;stroke:#c7bda9}.folder{fill:#25483d}.tab{fill:#d3ad61}.deep{fill:#173c32}.green{fill:#1f6a52}.mint{fill:#dceadf}.amber{fill:#d9a550}.red{fill:#a74739}.ink{fill:#17231f}.muted{fill:#60706a}.rule{stroke:#d7d0c1;stroke-width:2}.mono{font-family:'Courier New',monospace;font-weight:900;letter-spacing:.1em}.sans{font-family:Aptos,'Segoe UI',sans-serif;font-weight:800}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:700}
  </style>
</defs>
<rect width="1180" height="650" rx="38" class="bg"/><rect width="1180" height="650" rx="38" fill="url(#grain)"/>
<text x="54" y="68" class="mono" font-size="15" fill="#1f6a52">DIRECTOR IDV / PRACTICE HANDOVER BUNDLE</text>
<text x="54" y="126" class="serif ink" font-size="58">The pack leaves as an operating file, not loose templates.</text>
