    <rect x="28" y="30" width="112" height="30" rx="15" class="green"/><text x="46" y="51" class="mono" font-size="13" fill="#fff">CLIENTS</text>
    <text x="28" y="112" class="serif ink" font-size="34">Bulletin wording</text>
    <path d="M30 152h214M30 184h232M30 216h198M30 248h220" class="rule"/>
    <rect x="30" y="286" width="202" height="38" rx="19" class="mint"/><text x="52" y="311" class="sans" font-size="16" fill="#173c32">Plain-English FAQ</text>
  </g>
</g>
<g filter="url(#lift)">
  <g transform="translate(734 176) rotate(1.4)">
