<rect x="72" y="596" width="780" height="34" rx="17" fill="#173c32"/><text x="96" y="618" class="mono" font-size="12" fill="#fff">PARTNER NOTE · CLIENT BULLETIN · STAFF SCRIPT · DIRECTOR TRACKER · WEEKLY DIGEST</text>
