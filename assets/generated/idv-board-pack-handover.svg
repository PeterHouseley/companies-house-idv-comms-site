    <rect x="30" y="146" width="282" height="50" rx="14" fill="#eef5ed"/><text x="52" y="178" class="sans" font-size="16" fill="#17231f">42 briefed / 17 chase due</text>
    <rect x="30" y="214" width="282" height="50" rx="14" fill="#f6ead0"/><text x="52" y="246" class="sans" font-size="16" fill="#17231f">5 partner exceptions</text>
