<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
<title id="title">Director IDV board minutes pack</title>
<desc id="desc">A premium compliance board minutes pack showing partner decision, client notice proof, unresolved exceptions and a dated audit minute for Companies House identity verification communications.</desc>
<defs>
  <filter id="lift" x="-10%" y="-18%" width="126%" height="150%"><feDropShadow dx="0" dy="34" stdDeviation="28" flood-color="#173c32" flood-opacity="0.21"/></filter>
  <pattern id="minuteGrid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0v50" fill="none" stroke="#173c32" stroke-opacity=".045"/><circle cx="14" cy="16" r="1.4" fill="#b9822e" fill-opacity=".18"/></pattern>
  <style>.bg{fill:#efe7d6}.paper{fill:#fffdf7;stroke:#c7bda9}.deep{fill:#173c32}.green{fill:#1f6a52}.mint{fill:#dceadf}.amber{fill:#d8a24f}.red{fill:#a74739}.ink{fill:#17231f}.muted{fill:#60706a}.rule{stroke:#d7d0c1;stroke-width:2}.mono{font-family:'Courier New',monospace;font-weight:900;letter-spacing:.11em}.sans{font-family:Aptos,'Segoe UI',sans-serif;font-weight:800}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:700}</style>
</defs>
<rect width="1240" height="700" rx="42" class="bg"/><rect width="1240" height="700" rx="42" fill="url(#minuteGrid)"/>
<text x="58" y="72" class="mono" font-size="15" fill="#1f6a52">DIRECTOR IDV / PARTNER MINUTES PACK</text><text x="58" y="136" class="serif ink" font-size="58">Give the practice a dated decision trail before clients start asking twice.</text>
<g filter="url(#lift)"><g transform="translate(66 200) rotate(-1.2)"><rect width="350" height="400" rx="28" class="paper"/><rect x="30" y="30" width="154" height="30" rx="15" class="deep"/><text x="49" y="51" class="mono" font-size="13" fill="#fff">PARTNER MINUTE</text><text x="30" y="116" class="serif ink" font-size="36">Decision recorded</text><path d="M32 154h270M32 190h236M32 226h286M32 262h218" class="rule"/><rect x="32" y="314" width="238" height="42" rx="21" class="mint"/><text x="56" y="341" class="sans" font-size="16" fill="#173c32">Practice position signed off</text></g></g>
<path d="M420 398 C 470 332, 518 332, 568 398" stroke="#1f6a52" stroke-width="4" stroke-dasharray="10 9" fill="none"/>
<g filter="url(#lift)"><rect x="520" y="178" width="388" height="452" rx="30" class="deep"/><text x="552" y="226" class="mono" font-size="13" fill="#dceadf">CLIENT NOTICE PROOF</text><rect x="552" y="264" width="294" height="58" rx="16" fill="#fffdf7"/><text x="574" y="300" class="sans" font-size="17" fill="#17231f">Approved notice sent</text><rect x="552" y="342" width="294" height="58" rx="16" fill="#fffdf7"/><text x="574" y="378" class="sans" font-size="17" fill="#17231f">FAQ boundary linked</text><rect x="552" y="420" width="294" height="58" rx="16" fill="#fffdf7"/><text x="574" y="456" class="sans" font-size="17" fill="#17231f">Silent directors escalated</text><path d="M552 528h290" stroke="#dceadf" stroke-opacity=".32" stroke-width="2"/><text x="552" y="568" class="mono" font-size="12" fill="#dceadf">NO ADVICE DRIFT · NO UNOWNED CHASERS</text></g>
<path d="M912 398 C 960 332, 1000 332, 1048 398" stroke="#1f6a52" stroke-width="4" stroke-dasharray="10 9" fill="none"/>
<g filter="url(#lift)"><g transform="translate(960 224) rotate(1.4)"><rect width="220" height="330" rx="28" class="paper"/><text x="30" y="48" class="mono" font-size="13" fill="#1f6a52">EXCEPTIONS</text><g class="sans" font-size="15"><circle cx="44" cy="104" r="10" class="green"/><text x="70" y="109" fill="#17231f">Briefed</text><circle cx="44" cy="158" r="10" class="amber"/><text x="70" y="163" fill="#17231f">Needs chase</text><circle cx="44" cy="212" r="10" class="red"/><text x="70" y="217" fill="#17231f">Partner call</text></g><rect x="30" y="260" width="150" height="38" rx="19" class="mint"/><text x="54" y="285" class="sans" font-size="15" fill="#173c32">Minute closed</text></g></g>
<g transform="translate(920 84) rotate(7)"><rect width="194" height="58" rx="8" fill="none" stroke="#a74739" stroke-width="4"/><text x="28" y="36" class="mono" font-size="14" fill="#a74739">AUDIT-READY</text></g><rect x="74" y="628" width="760" height="34" rx="17" fill="#173c32"/><text x="98" y="650" class="mono" font-size="12" fill="#fff">PARTNER DECISION → CLIENT NOTICE → CHASE TRAIL → EXCEPTION QUEUE → DATED MINUTE</text>
</svg>