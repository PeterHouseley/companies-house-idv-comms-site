      <path d="M724 574h76" stroke="#173c32" stroke-width="4" stroke-dasharray="8 8"/>
      <circle cx="842" cy="574" r="38" fill="#f8f1df"/><text x="842" y="581" fill="#173c32">+14</text>
      <path d="M884 574h76" stroke="#173c32" stroke-width="4" stroke-dasharray="8 8"/>
      <circle cx="1002" cy="574" r="38" fill="#f7ece7"/><text x="1002" y="581" fill="#173c32">+28</text>
    </g>
