    <text x="622" y="258" fill="#bde2cc" font-family="Courier New, monospace" font-size="16" font-weight="900" letter-spacing="3">READINESS TRACKER</text>
    <g font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">
      <rect x="622" y="286" width="474" height="46" rx="12" fill="#fffdf7"/><text x="644" y="316" fill="#17231f">A. Patel</text><rect x="826" y="297" width="98" height="24" rx="12" fill="#1f6a52"/><text x="850" y="315" fill="#fff">Ready</text><text x="962" y="316" fill="#60706a">Log note</text>
      <rect x="622" y="344" width="474" height="46" rx="12" fill="#fffdf7"/><text x="644" y="374" fill="#17231f">M. Lewis</text><rect x="826" y="355" width="98" height="24" rx="12" fill="#b9822e"/><text x="844" y="373" fill="#fff">Unclear</text><text x="962" y="374" fill="#60706a">Partner check</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="462" width="538" height="176" rx="24" fill="#fffdf7" stroke="#d7d0c1"/>
    <text x="622" y="510" fill="#1f6a52" font-family="Courier New, monospace" font-size="16" font-weight="900" letter-spacing="3">CHASE CADENCE</text>
    <g font-family="Segoe UI, sans-serif" font-size="18" font-weight="900" text-anchor="middle">
