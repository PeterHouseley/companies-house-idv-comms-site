<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
  <title id="title">Director IDV weekly partner digest</title>
  <desc id="desc">A premium accountancy practice weekly digest showing director ID verification statuses, client question themes, overdue chasers and partner decisions.</desc>
  <defs>
    <filter id="lift" x="-10%" y="-18%" width="125%" height="150%"><feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#173c32" flood-opacity="0.18"/></filter>
    <pattern id="paper" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#173c32" stroke-opacity=".045"/><circle cx="10" cy="27" r="1.3" fill="#b9822e" fill-opacity=".16"/></pattern>
    <style>
      .bg{fill:#f2ebdc}.paper{fill:#fffdf7;stroke:#c7bda9}.deep{fill:#173c32}.green{fill:#1f6a52}.mint{fill:#dceadf}.amber{fill:#d8a24f}.red{fill:#a74739}.ink{fill:#17231f}.muted{fill:#60706a}.rule{stroke:#d7d0c1;stroke-width:2}.mono{font-family:'Courier New',monospace;font-weight:900;letter-spacing:.1em}.sans{font-family:Aptos,'Segoe UI',sans-serif;font-weight:800}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:700}
    </style>
  </defs>
  <rect width="1180" height="660" rx="38" class="bg"/><rect width="1180" height="660" rx="38" fill="url(#paper)"/>
  <text x="54" y="70" class="mono" font-size="15" fill="#1f6a52">DIRECTOR IDV / WEEKLY PARTNER DIGEST</text>
  <text x="54" y="130" class="serif ink" font-size="58">The Friday control note before Monday’s client noise.</text>
  <g filter="url(#lift)">
    <rect x="62" y="188" width="412" height="384" rx="28" class="paper"/>
    <rect x="92" y="220" width="132" height="30" rx="15" class="deep"/><text x="111" y="241" class="mono" font-size="13" fill="#fff">SUMMARY</text>
    <text x="92" y="302" class="serif ink" font-size="36">This week’s rollout position</text>
    <g class="sans" font-size="17">
      <rect x="92" y="338" width="318" height="48" rx="14" fill="#dceadf"/><text x="114" y="368" fill="#173c32">42 directors briefed</text><text x="356" y="368" fill="#173c32">+9</text>
      <rect x="92" y="404" width="318" height="48" rx="14" fill="#f6ead0"/><text x="114" y="434" fill="#173c32">17 reminders due</text><text x="356" y="434" fill="#173c32">Fri</text>
      <rect x="92" y="470" width="318" height="48" rx="14" fill="#f0d7d1"/><text x="114" y="500" fill="#173c32">5 partner decisions</text><text x="366" y="500" fill="#173c32">now</text>
    </g>
  </g>
  <g filter="url(#lift)">
    <rect x="514" y="170" width="296" height="420" rx="28" class="deep"/>
    <text x="544" y="216" class="mono" font-size="13" fill="#dceadf">QUESTION THEMES</text>
    <text x="544" y="270" class="serif" font-size="34" fill="#fffdf7">What clients asked twice</text>
    <g class="sans" font-size="15">
      <rect x="544" y="314" width="220" height="54" rx="14" fill="#fffdf7"/><text x="565" y="337" fill="#17231f">Who needs to act?</text><text x="565" y="358" fill="#60706a">use explainer paragraph 2</text>
      <rect x="544" y="386" width="220" height="54" rx="14" fill="#fffdf7"/><text x="565" y="409" fill="#17231f">Can the firm verify?</text><text x="565" y="430" fill="#60706a">boundary wording only</text>
      <rect x="544" y="458" width="220" height="54" rx="14" fill="#fffdf7"/><text x="565" y="481" fill="#17231f">What is the deadline?</text><text x="565" y="502" fill="#60706a">link official guidance</text>
    </g>
  </g>
  <g filter="url(#lift)">
    <rect x="850" y="200" width="270" height="354" rx="28" class="paper"/>
    <rect x="880" y="232" width="142" height="30" rx="15" class="green"/><text x="898" y="253" class="mono" font-size="13" fill="#fff">NEXT ACTION</text>
    <text x="880" y="316" class="serif ink" font-size="34">Partner queue</text>
    <path d="M882 346h176M882 376h204M882 406h156" class="rule"/>
    <rect x="882" y="446" width="184" height="44" rx="22" fill="#f0d7d1"/><text x="904" y="474" class="sans" font-size="15" fill="#173c32">Review 5 exceptions</text>
  </g>
  <path d="M474 380 C 510 330, 536 330, 572 380" stroke="#1f6a52" stroke-width="4" stroke-dasharray="10 9" fill="none"/>
  <path d="M806 380 C 842 330, 868 330, 904 380" stroke="#1f6a52" stroke-width="4" stroke-dasharray="10 9" fill="none"/>
  <g transform="translate(946 82) rotate(8)"><rect x="0" y="0" width="160" height="56" rx="8" fill="none" stroke="#a74739" stroke-width="4"/><text x="18" y="35" class="mono" font-size="14" fill="#a74739">FRIDAY NOTE</text></g>
  <rect x="64" y="602" width="690" height="34" rx="17" fill="#173c32"/><text x="88" y="624" class="mono" font-size="12" fill="#fff">WEEKLY CONTROL NOTE · CLIENT QUESTION THEMES · OVERDUE CHASERS · PARTNER EXCEPTIONS</text>
</svg>
